_target_: src.models.forecast.oceanforecast_module.ForecastLitModule

optimizer:
  _target_: torch.optim.AdamW
  _partial_: true
  lr: 5e-6
  betas: [0.9, 0.95]
  weight_decay: 5e-5

scheduler: null
#   _target_: src.utils.train_utils.GradualWarmupScheduler
#   _partial_: true
#   multiplier: 1
#   total_epoch: 10

after_scheduler: null
#   _target_: torch.optim.lr_scheduler.CosineAnnealingLR
#   _partial_: true
#   T_max: 90
#   eta_min: 0
#   verbose: True

net:
  _target_: src.models.forecast.oceanforecast.arch.OceanForecast
  atmos_vars: [
    "land_sea_mask", "orography", "latitude", "longitude",
    "z_500", "z_850", "msl", "t2m", "u10", "v10",
  ]
  ocean_vars: [
    "thetao_0.5",
  ]
  img_size: [120, 240]
  window_size: 6
  patch_size: 4
  embed_dim_atmos: 256
  embed_dim_ocean: 512  
  num_heads: 16
  depths: [5, 5, 5, 5]
  mlp_ratio: 4.0
  drop_path: 0.2
  drop_rate: 0.2
  attn_drop: 0.
  const_dir: ${paths.scale_dir}

mean_path: ${paths.scale_dir}/normalize_mean.npz
std_path: ${paths.scale_dir}/normalize_std.npz
ckpt_path: ${paths.ckpt_dir}/oceanforecast_ar2.ckpt 
dict_vars: [
    "thetao_0.5"
]
loss:
  _target_: src.utils.train_utils.WeightedL1Loss
